# Checks every push and pull request: the type check and the fast tests (the
# same as the pre-push hook), the deep tests beside them, the shell scripts
# (the SSH runner as the remote shell gets it included) and workflows, and that
# the t3 package's strip rules still apply to its pinned upstream commit.
# Building that happens in build.yml when the rules or build code change, and
# hourly in evaluate.yml. Read-only token, no secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # TypeScript and Node's types, exactly as package-lock.json pins them (each
      # tarball checked against its integrity hash), no install scripts. Only the
      # type check uses them: Node runs the .ts files itself.
      - name: Dev dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures

      - name: Type check
        run: |
          node_modules/.bin/tsc --noEmit
          node_modules/.bin/tsc --noEmit -p packages/t3

      - name: Tests (fast tier)
        run: node tools/test.ts fast

      # One script per syntax check (bash -n reads only its first file), with the
      # shell its shebang names.
      - name: Shell scripts
        run: |
          scripts="blacksand .githooks/pre-push packages/t3/install.sh packages/t3/scripts/*.sh packages/substrate-k8s/images/agent-tools.sh packages/substrate-k8s/sandbox/steps.sh"
          for script in $scripts; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac || { echo "syntax error in $script"; exit 1; }
          done
          # shellcheck disable=SC2086 # the list above, one word per path
          shellcheck -S warning $scripts

      # The injected runner is template-literal source; check what /bin/sh on the
      # host runs. SC1090: it sources the account's server.env on purpose.
      # SC3067: test -O is in both shells it meets (macOS bash as sh, dash).
      - name: SSH runner (packages/t3/lib/files/ssh-runner-blackout.sh, rendered)
        working-directory: packages/t3
        run: |
          node ci/render-runner.mjs fragment lib/files/ssh-runner-blackout.sh "$RUNNER_TEMP/runner.sh"
          sh -n "$RUNNER_TEMP/runner.sh"
          bash --posix -n "$RUNNER_TEMP/runner.sh"
          shellcheck -s sh -S warning -e SC1090,SC3067 "$RUNNER_TEMP/runner.sh"

      - name: Workflows (actionlint 1.7.12, checksum pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Every action is pinned to a full commit SHA
        run: node packages/t3/ci/check-action-pins.mjs

      - name: pin.json and lib/overrides.json are valid, and every pinned tag names its commit upstream
        working-directory: packages/t3
        run: |
          node -e 'import("./lib/pin.mjs").then((m) => m.readPin()).then((p) => console.log(JSON.stringify(p.channels)))'
          node -e 'import("./lib/overrides.mjs").then((m) => console.log(m.readOverrides().length, "security overrides,", m.readToolOverrides().length, "device tool overrides"))'
          node bin/t3blackout pin-check

      # The pinned commit itself, not its tag (a tag can move; the step above
      # catches that). A runner is no install: it checks as itself, said so
      # explicitly (lib/install-config.mjs buildAsYouProblem).
      - name: Strip rules apply to the pinned commit
        working-directory: packages/t3
        env:
          T3BLACKOUT_UNISOLATED_BUILD: "1"
        run: |
          sha=$(node -p "require('./pin.json').channels.nightly.sha")
          node bin/t3blackout check --ref "$sha"

  # Signed git histories, installer and script runs, real timeouts and property
  # sweeps (tools/test.ts). Node strips the types itself: no install step.
  deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tests (deep tier)
        run: node tools/test.ts deep
