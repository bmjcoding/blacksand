# Picks the newest upstream release that passes every gate (bin/t3
# evaluate), pins it in pin.json with the evaluator's key, and turns advisories
# against the pin on main into issues. Hourly, so a security fix upstream ships
# lands within the hour (the fast lane, lib/fastlane.mjs).
#
# Four jobs, because the evaluate job builds and runs untrusted upstream code
# and its dependencies (Oct 2026: SubQuery's payload read CI runner memory):
#   evaluate  read-only token, no secrets; its pin.json, report, resolved
#             lockfiles and stage records (the staged production install of
#             each release it built, lib/inventory.mjs) are artifacts, and only
#             ever a proposal
#   check     fresh runner, no secrets: re-derives every gate
#             it can from git, npm and the advisory sources (OSV, GitHub's;
#             bin/t3 pin-check, lib/pincheck.mjs), uploads the pin and main SHA
#   commit    fresh runner, main-only evaluator environment, pinned GitHub-owned
#             actions and inline shell only; exact-SHA, pin-only, ff-only publish
#             requires repository variable BLACKSAND_EVALUATOR_PUBLISH=true
#   alerts    after commit: advisories against the pin actually on main
#             (bin/t3 advisories), then issues only. It runs when the
#             evaluate job failed or timed out too: what that job didn't leave is
#             a coverage gap, and upstream's lockfile stands in for it. The held
#             issue closes only on a pin the commit job pushed, or when upstream
#             (read here, bin/t3 releases) has nothing newer than main's pin.
# All of this is advisory. Every machine's self-update accepts the evaluator's
# key only for pin.json-only commits that move no channel backward
# (lib/selfupdate.mjs), and then re-checks the pin itself before installing it,
# from git, npm and this repo: a forged result or a stolen evaluator key can at
# worst hold an update or make it fail, never install unchecked code.
#
# Only nightly is evaluated. Another channel needs a first pin in a commit you
# sign (bin/t3 evaluate --channel stable --baseline <tag> --write, run
# locally); until then every machine refuses it (lib/channels.mjs).

name: Evaluate upstream

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: evaluate
  cancel-in-progress: false

env:
  CHANNEL: nightly

# Paths in the steps are the t3 package's.
defaults:
  run:
    working-directory: tooling/blacksand-t3

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read # the last evaluation's artifact
    outputs:
      exit: ${{ steps.evaluate.outputs.exit }}
      artifact: ${{ steps.evaluation.outputs.artifact-id }}
    steps:
      # Full history, without file contents (fetched when read).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # install.sh's pnpm, from the registry tarballs it pins by SHA-512 (lib/pnpm.mjs
      # checks the binary before each run). Not Corepack: that takes the version, its
      # registry and its signing keys from the checkout (packageManager, .corepack.env).
      - name: Pinned pnpm
        timeout-minutes: 5
        run: |
          bash -c 'source ./install.sh && install_pnpm "$HOME/.local"'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Upstream's Linux packager checks for these first (scripts/
      # build-desktop-artifact.ts LINUX_DESKTOP_BUILD_PREREQUISITES); the runner
      # image has Rust, a C toolchain and pkg-config but not these two.
      - name: Linux packaging prerequisites
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libsecret-1-dev imagemagick

      # Each step has its own limit, under the job's, so a stuck one fails the
      # job instead of cancelling it: the upload and the alerts job still run.
      - name: Repo tests
        timeout-minutes: 15
        run: node --test test/*.test.mjs

      # The pinned release's stage record from the last evaluation, so it isn't
      # rebuilt every hour: used only if it's for that commit, this build code
      # and this platform, and its lockfile checks out (lib/inventory.mjs);
      # otherwise the evaluation builds the pinned release.
      - name: The last evaluation's stage records
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow evaluate.yml --branch main --status completed \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty') || run=""
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name evaluation --dir "$RUNNER_TEMP/previous" ||
              echo "run $run left no evaluation artifact"
          fi

      # Lockfiles and stage records are written as they're made, so a failed or
      # timed-out evaluation still uploads what it had. The job's own token, for
      # GitHub's advisory API only (lib/advisories.mjs): unauthenticated, a
      # runner's shared address has 60 requests an hour. It's read-only here
      # (contents, actions), the code this job runs could reach it on the runner
      # anyway, and the evaluator takes it out of the environment before it
      # starts anything, so upstream's install and build don't inherit it. A
      # runner is no install: it resolves and builds as itself, said so
      # explicitly (lib/install-config.mjs buildAsYouProblem).
      - name: Evaluate
        id: evaluate
        timeout-minutes: 90
        env:
          BLACKSAND_T3_GITHUB_TOKEN: ${{ github.token }}
          BLACKSAND_T3_UNISOLATED_BUILD: "1"
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          node bin/t3 evaluate --channel "$CHANNEL" --build --write --stage-from "$RUNNER_TEMP/previous/resolved" \
            --report "$RUNNER_TEMP/out/report.md" --resolved "$RUNNER_TEMP/out/resolved"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cp pin.json "$RUNNER_TEMP/out/pin.json" 2>/dev/null || true

      - id: evaluation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evaluation
          path: ${{ runner.temp }}/out
          retention-days: 7

  check:
    needs: evaluate
    if: needs.evaluate.outputs.exit == '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      # The commit job downloads this artifact by ID, so no other job's upload
      # can stand in for it.
      pin: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.evaluate.outputs.artifact }}
          path: ${{ runner.temp }}/evaluation

      # No upstream or npm code runs here, and no key is in reach: pin-check
      # reads upstream with git, npm and the advisory sources (OSV, GitHub's)
      # over HTTPS and applies the strip rules to upstream's source as text. It
      # writes pin.json when it passes. The job's token goes to GitHub's advisory
      # API alone (lib/advisories.mjs), for its rate limit.
      - name: Re-derive the gates
        id: check
        env:
          BLACKSAND_T3_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node bin/t3 pin-check --channel "$CHANNEL" --candidate "$RUNNER_TEMP/evaluation/pin.json" \
            --resolved "$RUNNER_TEMP/evaluation/resolved" --result "$RUNNER_TEMP/verdict"
          echo "verdict=$(cat "$RUNNER_TEMP/verdict")" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/pin"
          cp pin.json "$RUNNER_TEMP/pin/pin.json"
          git rev-parse HEAD > "$RUNNER_TEMP/pin/main-sha"

      # Data only: the pin.json pin-check wrote and the main commit it checked.
      - name: Hand the pin to the commit job
        id: upload
        if: steps.check.outputs.verdict == 'changed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin
          path: ${{ runner.temp }}/pin
          if-no-files-found: error
          retention-days: 7

  # The keys never share a runner with code the App can write. Every step here is
  # this file's shell or a GitHub-owned action pinned by SHA: no node, no npm, no
  # script from the checkout, which is only git objects to build one commit on.
  # Each job gets a fresh runner, and GITHUB_ENV and GITHUB_PATH reach only later
  # steps of the same job, so nothing the check job ran can follow it here.
  commit:
    needs: check
    if: needs.check.outputs.verdict == 'changed' && vars.BLACKSAND_EVALUATOR_PUBLISH == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: evaluator
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    outputs:
      # The ref it signed and pushed; empty when it pushed nothing.
      published: ${{ steps.push.outputs.published }}
    steps:
      # No credentials in .git/config: the push below passes the token itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.pin }}
          path: ${{ runner.temp }}/pin

      # The proposal is data. Git plumbing builds the tree: it reads no
      # working-tree file, runs no hook and applies no .gitattributes filter
      # (hash-object --no-filters). It refuses anything but a pin.json change on
      # the main commit the check job saw.
      - name: Check the proposal
        id: proposal
        env:
          PUBLISH: ${{ vars.BLACKSAND_EVALUATOR_PUBLISH }}
        run: |
          set -euo pipefail
          # Actions string equality ignores case; enforce owner intent here.
          [[ "$PUBLISH" == true && "$GITHUB_REF" == refs/heads/main ]] || {
            echo 'Publication requires literal true on main'
            exit 1
          }
          git config core.hooksPath /dev/null
          pin="$RUNNER_TEMP/pin/pin.json"
          [ -f "$pin" ] && [ ! -L "$pin" ] || { echo "no pin.json in the check job's artifact"; exit 1; }
          sha="$RUNNER_TEMP/pin/main-sha"
          [ -f "$sha" ] && [ ! -L "$sha" ] || { echo "no checked main SHA"; exit 1; }
          head=$(git rev-parse HEAD)
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$head" | cmp -s - "$sha" || { echo "main differs from the check job's exact SHA: not signing"; exit 1; }
          git update-index --cacheinfo "100644,$(git hash-object -w --no-filters "$pin"),tooling/blacksand-t3/pin.json"
          tree=$(git write-tree)
          changed=$(git diff-tree -r --name-only HEAD "$tree")
          [ "$changed" = tooling/blacksand-t3/pin.json ] || { echo "refusing: the change isn't pin.json alone: ${changed:-nothing}"; exit 1; }
          [ "$(jq -s length "$pin")" = 1 ] || { echo "not one pin document"; exit 1; }
          ref=$(jq -er --arg channel "$CHANNEL" '.channels[$channel].ref | select(type == "string") | select(test("\\Av[0-9A-Za-z.+-]+\\z"))' "$pin")
          [[ "$ref" =~ ^v[0-9A-Za-z.+-]+$ ]] || { echo "refusing: not a release tag: $ref"; exit 1; }
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # A token for this repository alone, contents write only, that expires within
      # the hour; the action tries to revoke it when the job ends.
      - name: The evaluator App's token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BLACKSAND_EVALUATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLACKSAND_EVALUATOR_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Sign and push the pin
        id: push
        env:
          SIGNING_KEY: ${{ secrets.BLACKSAND_EVALUATOR_SIGNING_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TREE: ${{ steps.proposal.outputs.tree }}
          REF: ${{ steps.proposal.outputs.ref }}
        run: |
          set -euo pipefail
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REF" =~ ^v[0-9A-Za-z.+-]+$ ]]
          key=$(mktemp) # mode 600
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          commit=$(git -c gpg.format=ssh -c gpg.ssh.program=ssh-keygen -c user.signingkey="$key" \
            -c user.name="blacksand evaluator" -c user.email="blacksand-evaluator@users.noreply.github.com" \
            commit-tree -S -p HEAD -m "Pin $CHANNEL to $REF" "$TREE")
          rm -f "$key"
          # The token goes to git through its environment, not its command line.
          # A plain push: if main moved since, it isn't a fast-forward and fails.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            git -c core.hooksPath=/dev/null push origin "$commit:refs/heads/main"
          echo "published=$REF" >> "$GITHUB_OUTPUT"

  alerts:
    needs: [evaluate, commit]
    if: always() && needs.evaluate.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # main as it is now, after the commit job: the pin every machine builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Whatever the evaluate job left, if anything: without it the advisory
      # check still runs and says what it couldn't cover.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: evaluation
          path: ${{ runner.temp }}/evaluation

      - name: Security advisories
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BLACKSAND_T3_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node bin/t3 advisories --channel "$CHANNEL" --resolved "$RUNNER_TEMP/evaluation/resolved" --out "$RUNNER_TEMP/advisories.json"
          node ci/security-issues.mjs advisories "$RUNNER_TEMP/advisories.json"

      # EXIT and the report come from the job that ran upstream code: they can
      # open the held issue, never close it. Closing takes PUBLISHED (what the
      # commit job pushed) or upstream's own tags (bin/t3 releases).
      - name: Held releases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXIT: ${{ needs.evaluate.outputs.exit }}
          PUBLISHED: ${{ needs.commit.outputs.published }}
        run: |
          pinned=$(node -p "require('./pin.json').channels[process.env.CHANNEL]?.ref ?? ''")
          releases=0
          node bin/t3 releases --channel "$CHANNEL" --out "$RUNNER_TEMP/newer.json" || releases=$?
          node ci/security-issues.mjs held --channel "$CHANNEL" --exit "$EXIT" --published "$PUBLISHED" \
            --pinned "$pinned" --newer "$RUNNER_TEMP/newer.json" --report "$RUNNER_TEMP/evaluation/report.md"
          exit "$releases"
