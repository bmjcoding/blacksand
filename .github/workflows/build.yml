# Builds the pinned releases with this commit's rules, injected files, overrides
# and build code whenever those or pin.json change: typecheck, package,
# forbidden-endpoint scan and offline smoke test (bin/t3blackout check --build),
# then the tests in test/stripped/ inside the stripped checkout and a syntax check
# of the SSH runner as upstream's tunnel.ts renders it. Each pinned channel the
# change affects is built (ci/build-channels.mjs): a pin-only commit
# builds the channels it moved. The hourly evaluator builds only when upstream
# has a newer release, so without this a rule or pin change that no longer
# compiles would pass CI, and every machine would find out on its next update
# (each Mac builds and checks a pin itself before installing it, so it holds the
# update there; this says so first). Advisory, like every CI result.
# Runs upstream code: read-only token, no secrets.

name: Build the pinned release

on:
  push:
    branches: [main]
    paths:
      - "packages/t3/bin/**"
      - "packages/t3/lib/**"
      - "packages/t3/pin.json"
      - "packages/t3/test/stripped/**"
      - ".github/workflows/build.yml"
      - "packages/t3/ci/build-channels.mjs"
      - "packages/t3/ci/is-main.mjs"
      - "packages/t3/ci/render-runner.mjs"
      - "packages/t3/ci/stripped-tests.mjs"
  pull_request:
    paths:
      - "packages/t3/bin/**"
      - "packages/t3/lib/**"
      - "packages/t3/pin.json"
      - "packages/t3/test/stripped/**"
      - ".github/workflows/build.yml"
      - "packages/t3/ci/build-channels.mjs"
      - "packages/t3/ci/is-main.mjs"
      - "packages/t3/ci/render-runner.mjs"
      - "packages/t3/ci/stripped-tests.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Paths in the steps are the t3 package's.
defaults:
  run:
    working-directory: packages/t3

jobs:
  channels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      # Full history, without file contents (fetched when read): the change is
      # measured against its base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pinned channels this change affects
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          list=$(node ci/build-channels.mjs "$BASE")
          echo "building: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: channels
    if: needs.channels.outputs.list != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.channels.outputs.list) }}
    env:
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # install.sh's pnpm, from the registry tarballs it pins by SHA-512 (lib/pnpm.mjs
      # checks the binary before each run). Not Corepack: that takes the version, its
      # registry and its signing keys from the checkout (packageManager, .corepack.env).
      - name: Pinned pnpm
        timeout-minutes: 5
        run: |
          bash -c 'source ./install.sh && install_pnpm "$HOME/.local"'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Upstream's Linux packager checks for these first (scripts/
      # build-desktop-artifact.ts LINUX_DESKTOP_BUILD_PREREQUISITES); the runner
      # image has Rust, a C toolchain and pkg-config but not these two.
      - name: Linux packaging prerequisites
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libsecret-1-dev imagemagick

      # The pinned commit itself, not its tag (a tag can move). A runner is no
      # install: it builds as itself, said so explicitly (lib/install-config.mjs).
      # The job's read-only token, for GitHub's advisory API alone (a young
      # device tool's fast lane, lib/device-tools.mjs): unauthenticated, a
      # runner's shared address has 60 requests an hour. The build takes it
      # out of its environment before it starts anything (lib/github-token.mjs);
      # the code it builds could reach the runner's own copy anyway.
      - name: Build the pinned release
        env:
          T3BLACKOUT_UNISOLATED_BUILD: "1"
          T3BLACKOUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          sha=$(node -p "require('./pin.json').channels[process.env.CHANNEL].sha")
          node bin/t3blackout check --ref "$sha" --build

      # The *.browser.test.tsx ones run in upstream's Playwright project (headless
      # Chromium, the version upstream's lockfile pins).
      - name: Chromium for the browser tests
        working-directory: packages/t3/build/work/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests in the stripped checkout (packages/t3/test/stripped)
        run: node ci/stripped-tests.mjs build/work

      - name: The SSH runner as tunnel.ts renders it
        run: |
          node ci/render-runner.mjs tunnel build/work/packages/ssh/src/tunnel.ts "$RUNNER_TEMP/runner.sh"
          sh -n "$RUNNER_TEMP/runner.sh"
